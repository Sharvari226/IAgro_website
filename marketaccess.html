<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer's Market</title>
    <style>
        body {
            font-family: Georgia, 'Times New Roman', Times, serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 10px 0;
        }
        nav {
            background-color: #333;
            overflow: hidden;
        }
        nav a {
            float: left;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        nav a:hover {
            background-color: #ddd;
            color: white;
        }
        .content {
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
        .graph {
            margin-top: 20px;
            padding: 10px;
            border: 1px dashed #ccc;
            text-align: center;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
    <!-- Include Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>Market Size of Crops</h1>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <div class="content">
        <table>
            <thead>
                <tr>
                    <th>Crop</th>
                    <th>Market Size (in Million USD)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Wheat</td>
                    <td>1000</td>
                </tr>
                <tr>
                    <td>Corn</td>
                    <td>1200</td>
                </tr>
                <tr>
                    <td>Rice</td>
                    <td>800</td>
                </tr>
                <tr>
                    <td>Soybeans</td>
                    <td>950</td>
                </tr>
                <tr>
                    <td>Cotton</td>
                    <td>600</td>
                </tr>
                <!-- Add more crops as needed -->
            </tbody>
        </table>

        <div class="graph">
            <h2>Market Size Graph</h2>
            <canvas id="marketSizeChart" width="400" height="200"></canvas>
            <script>
                const ctx = document.getElementById('marketSizeChart').getContext('2d');
                const marketSizeChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['Wheat', 'Corn', 'Rice', 'Soybeans', 'Cotton'],
                        datasets: [{
                            label: 'Market Size (in Million USD)',
                            data: [1000, 1200, 800, 950, 600],
                            backgroundColor: [
                                'rgba(75, 192, 192, 0.2)',
                                'rgba(153, 102, 255, 0.2)',
                                'rgba(255, 159, 64, 0.2)',
                                'rgba(255, 99, 132, 0.2)',
                                'rgba(54, 162, 235, 0.2)'
                            ],
                            borderColor: [
                                'rgba(75, 192, 192, 1)',
                                'rgba(153, 102, 255, 1)',
                                'rgba(255, 159, 64, 1)',
                                'rgba(255, 99, 132, 1)',
                                'rgba(54, 162, 235, 1)'
                            ],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            </script>
        </div>
    </div>
</body>
</html>
